name: libredbtest

services:
  dokku:
    build:
      context: ./dokku
      args:
        DOKKU_VERSION: ${DOKKU_VERSION:-latest}
    container_name: libredbtest-dokku
    # Dokku's own Docker install runs its container on the default bridge network
    # (docs/getting-started/install/docker.md). On a compose project network the
    # nginx inside this container cannot reach app containers on the bridge, so
    # every proxied request to an app times out with 504.
    network_mode: bridge
    restart: unless-stopped
    environment:
      - DOKKU_HOSTNAME=dokku.test
      - DOKKU_HOST_ROOT=${LIBREDBTEST_HOST_DIR}/home/dokku
      - DOKKU_LIB_HOST_ROOT=${LIBREDBTEST_HOST_DIR}/var/lib/dokku
    volumes:
      - ${LIBREDBTEST_HOST_DIR}:/mnt/dokku
      - /var/run/docker.sock:/var/run/docker.sock
      - ../:/plugin-src:ro
